name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Before submitting, search for an existing similar issue.
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What happens and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Click on...
        3. See the error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system and Node version.
      placeholder: "Chrome 140 / Linux / Node 22.12"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Paste console errors or screenshots.
      render: shell
    validations:
      required: false
